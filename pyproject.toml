[project]
name = "governed-agent-ops"
version = "0.1.0"
description = "Governed multi-agent operations: outcome-verified dispatch, key-level budgets, PII firewall, eval-gated models, compliance-as-data, human approvals."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
yaml = ["pyyaml>=6"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
